name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Java (для современных версий 26.x / 1.21+ нужна Java 21)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Настраиваем кеширование Gradle (ускоряет сборку в разы)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Даем права на запуск Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Собираем мод
      - name: Build with Gradle
        run: ./gradlew build

      # 6. Сохраняем готовый .jar файл в артефакты
      - name: Upload Mod Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Mod-Build
          path: build/libs/*.jar
          
